name: FDA Daily Scanner

on:
  schedule:
    # 美东凌晨 00:30 (冬令时对应 UTC 05:30)
    - cron: '30 5 * * 1-5' 
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 yfinance lxml

      - name: Run script
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python fda_scanner.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 关键：如果文件不存在则创建，防止 git add 报错
          touch seen_designations.txt
          git add seen_designations.txt
          # 只有在文件有变动时才 commit
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update seen designations" && git push)
