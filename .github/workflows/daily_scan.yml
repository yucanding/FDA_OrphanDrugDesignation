name: FDA Daily Scanner

on:
  schedule:
    - cron: '30 4 * * 1-5' 
  workflow_dispatch: 

permissions:
  contents: write  # 必须开启写入权限，否则无法更新 txt

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 yfinance

      - name: Run script
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python fda_scanner.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add seen_designations.txt
          # 只有在文件有变动时才 commit，防止报错
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update seen designations" && git push)
