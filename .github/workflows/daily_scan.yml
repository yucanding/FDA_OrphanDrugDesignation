name: FDA Daily Scanner

on:
  schedule:
    # 美东夏令时(EDT)凌晨 00:30，周一至周五运行
    - cron: '30 4 * * 1-5' 
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # 关键更新：加入了 deep-translator 依赖
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 yfinance lxml deep-translator

      - name: Run script
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python fda_scanner.py

      # 关键更新：处理新的 seen_orphan_drugs.txt 文件
      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          touch seen_orphan_drugs.txt
          git add seen_orphan_drugs.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update seen orphan drugs" && git push)
