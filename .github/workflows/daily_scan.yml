name: FDA Daily Scanner

on:
  schedule:
    - cron: '0 21 * * 0'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 yfinance lxml deep-translator

      - name: Run script
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python fda_scanner.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          touch seen_orphan_drugs.txt
          git add seen_orphan_drugs.txt

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update seen orphan drugs [skip ci]"
            git push
          fi

      - name: Notify Telegram on Failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          IFS=',' read -ra CHAT_IDS <<< "$TG_CHAT_ID"

          MESSAGE="🚨 FDA Daily Scanner 运行失败！

          Workflow: ${{ github.workflow }}
          Run: #${RUN_NUMBER}

          错误日志：
          ${RUN_URL}"

          for CID in "${CHAT_IDS[@]}"; do
            CID=$(echo "$CID" | xargs)
            [ -z "$CID" ] && continue

            curl --fail-with-body --silent --show-error \
              -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${CID}" \
              --data-urlencode "text=${MESSAGE}"
          done
