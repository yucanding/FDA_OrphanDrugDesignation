name: FDA Daily Scanner

on:
  # 使用原生 Cron 触发：每周日 UTC 21:00 (对应美东夏令时 17:00)
  schedule:
    - cron: '0 21 * * 0'

  # 保留手动触发入口，方便测试或配合外部触发器
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # 升级到 v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 yfinance lxml deep-translator

      - name: Run script
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python fda_scanner.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 确保文件存在，防止 git add 报错
          touch seen_orphan_drugs.txt
          git add seen_orphan_drugs.txt
          # 仅在有内容变化时提交，并使用 [skip ci]
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update seen orphan drugs [skip ci]" && git push)
